name: CI build
on:
  push:
    tags: [ "*" ]
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-release:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        id: sign_apk
        if: ${{ secrets.KEYSTORE != 0 }}
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0
      - name: Upload signed release APK
        if: steps.sign_apk.outputs.signedFile != 0
        uses: actions/upload-artifact@v7
        with:
          name: mcubstatus-ci-apk
          path: ${{ steps.sign_apk.outputs.signedFile }}
          if-no-files-found: error
      - name: Upload unsigned release APK (no signing secrets configured)
        if: steps.sign_apk.outputs.signedFile == 0
        uses: actions/upload-artifact@v7
        with:
          name: mcubstatus-ci-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
